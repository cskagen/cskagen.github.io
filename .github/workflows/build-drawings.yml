name: Build drawings

on:
  workflow_dispatch:
  push:
    paths:
      - 'images/**'
      - 'build.py'
      - '.github/workflows/build-drawings.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: python build.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawings archive_report.txt archive_report.json sitemap.xml archive.html index.html archive_report.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Generate drawing pages"
          git push origin HEAD:main